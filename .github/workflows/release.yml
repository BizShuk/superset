name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi

      - name: Build and verify VSIX
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload verified VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: superset-vsix
          path: superset-*.vsix
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download verified VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: superset-vsix
          path: dist

      - name: Prepare fixed VSIX release asset
        shell: bash
        run: |
          shopt -s nullglob
          vsix_files=(dist/superset-*.vsix)

          if (( ${#vsix_files[@]} != 1 )); then
            echo "Expected exactly one superset-*.vsix, found ${#vsix_files[@]}" >&2
            printf '%s\n' "${vsix_files[@]}" >&2
            exit 1
          fi

          mv "${vsix_files[0]}" superset.vsix

      - name: Create GitHub release with VSIX only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Superset $GITHUB_REF_NAME" \
            --generate-notes \
            "superset.vsix"
